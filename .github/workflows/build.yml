name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  persistence-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify current web installer release pins and load flow
        run: node --experimental-vm-modules tools/test_webflash_loader.mjs docs
      - name: checked preferences and power failures
        run: |
          mkdir -p build
          python3 tools/test_records_capacity.py
          python3 tools/test_settings_all_preferences.py
          python3 tools/test_settings_aux_storage.py
          python3 tools/test_settings_validation.py
          python3 tools/test_power_handoff.py
          python3 tools/test_sleep_save_failure.py
          python3 tools/test_sleep_wake_sources.py
          python3 tools/test_sd_media_guard.py
          python3 tools/test_ui_bitmap.py
          python3 tools/test_foundation_hardening.py
          python3 tools/test_file_reference_http.py

  build:
    runs-on: ubuntu-latest
    # 钉在 v6.1 发布点。release-v6.1 分支会继续演进，LCD LL 接口已经变过一次。
    # Pin to the v6.1 release. The release-v6.1 branch keeps moving; the LCD LL API already changed once.
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      # sdkconfig.defaults 里的 120MHz flash / PSRAM 依赖真机的 flash 型号，
      # CI 用 sdkconfig.ci 换成默认时序，只验证能不能编过。
      # The 120 MHz flash / PSRAM timing in sdkconfig.defaults needs the real
      # flash part; CI uses sdkconfig.ci (default timing) and only checks that it compiles.
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -DSDKCONFIG_DEFAULTS=sdkconfig.ci set-target esp32s3
          idf.py -DSDKCONFIG_DEFAULTS=sdkconfig.ci build
          python3 tools/verify_inkbuddy_build.py build --expect public --out build/build-verification.json

      - name: size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size
